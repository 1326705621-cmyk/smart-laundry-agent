[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-laundry-agent"
version = "0.1.0"
description = "AI 家庭洗晒助手"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai>=1.0,<3.0",
    "pillow>=10.0,<13.0",
    "pydantic>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.31,<3.0",
    "streamlit>=1.40,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
